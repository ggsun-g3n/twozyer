<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control Panel</title>
<style>
:root{--bg:#000;--panel:#0d0d0d;--panel2:#151515;--line:#262626;--text:#f4efe9;--muted:#8c857e;--accent:#D97757;--accent-soft:rgba(217,119,87,.14);--ok:#6fcf97;--warn:#e9b84f;--bad:#eb6b5e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;min-height:100vh}
::selection{background:var(--accent);color:#000}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;outline:none}
button,label,.acc,th{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.55;cursor:not-allowed}
input,select{outline:none}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;cursor:pointer}
input[type=checkbox]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;z-index:10;background:rgba(0,0,0,.92);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px clamp(16px,4vw,40px);border-bottom:1px solid var(--line)}
.brand{font-size:20px;font-weight:700;letter-spacing:-.01em}
.brand b{color:var(--accent)}
.top .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top .count{color:var(--muted);font-size:13px;margin-right:6px}
.wrap{display:grid;grid-template-columns:360px 1fr;gap:20px;padding:20px clamp(16px,4vw,40px);max-width:1360px;margin:0 auto;align-items:start}
@media(max-width:900px){.wrap{grid-template-columns:1fr}.side{position:static!important;max-height:none!important}.acc-list{max-height:380px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:78px;max-height:calc(100vh - 98px)}
.side .card{display:flex;flex-direction:column;gap:12px;min-height:0;flex:1}
.stack{display:flex;flex-direction:column;gap:14px}
label.l{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=number],input[type=search],input[type=email],input[type=password],input[type=datetime-local],input:not([type]),select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;transition:border-color .15s}
input:focus,select:focus{border-color:var(--accent)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.btn{background:var(--accent);color:#120804;border:0;border-radius:9px;padding:10px 16px;font-weight:600;transition:filter .15s,border-color .15s,color .15s;white-space:nowrap}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent);filter:none}
.btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(235,107,94,.4)}
.btn.danger:hover:not(:disabled){background:rgba(235,107,94,.1);filter:none}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.row{display:flex;gap:10px;align-items:center}
.row.w{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:transparent;border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:13px;color:var(--muted);transition:.15s}
.chip:hover{border-color:#555;color:var(--text)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted)}
.tiny{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.tiny label{display:flex;gap:8px;align-items:center;cursor:pointer}
.bulk{display:none;align-items:center;justify-content:space-between;gap:8px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:8px 10px;font-size:13.5px}
.bulk.on{display:flex}
.acc-list{display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:120px;flex:1;padding-right:2px}
.acc{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:6px 8px;transition:border-color .15s}
.acc:hover{border-color:#444}
.acc.on{border-color:var(--accent);background:var(--accent-soft)}
.acc .main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;padding:4px}
.av{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#120804;display:grid;place-items:center;font-weight:800;flex:none}
.info{min-width:0;flex:1}
.info b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info small{color:var(--muted);font-size:12.5px}
.val{font-size:13px;color:var(--accent);font-weight:600;flex:none}
.star{background:none;border:0;font-size:18px;color:#4a4a4a;padding:2px 4px;line-height:1;transition:color .15s}
.star.on{color:var(--accent)}
.star:hover{color:var(--accent)}
.more{text-align:center}
.empty{color:var(--muted);text-align:center;padding:28px 12px;font-size:14px}
.empty.big{padding:70px 12px}
.empty .btn{margin-top:14px}
.head{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start;margin-bottom:16px}
.who{display:flex;gap:14px;align-items:center}
.who .av{width:48px;height:48px;border-radius:14px;font-size:20px}
.who h2{font-size:22px;line-height:1.2;word-break:break-word}
.who .sub{color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
@media(max-width:620px){.stats{grid-template-columns:1fr 1fr}}
.stats div{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px 14px}
.stats small{color:var(--muted);font-size:12.5px}
.stats strong{display:block;font-size:19px;margin-top:2px}
.stats .ac{color:var(--accent)}
.tools2{display:grid;grid-template-columns:1fr 150px auto;gap:8px;margin-bottom:12px}
@media(max-width:620px){.tools2{grid-template-columns:1fr 1fr}.tools2 .btn{grid-column:span 2}}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:11px}
table{width:100%;border-collapse:collapse;min-width:820px}
th,td{padding:11px 13px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:13px;background:var(--panel2)}
tr:last-child td{border-bottom:0}
td.id{color:var(--muted);font-size:13px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12.5px;border:1px solid}
.tag.Success{color:var(--ok);border-color:rgba(111,207,151,.4)}
.tag.Pending{color:var(--warn);border-color:rgba(233,184,79,.4)}
.tag.Failed{color:var(--bad);border-color:rgba(235,107,94,.4)}
.acts{display:flex;gap:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.open{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:470px;max-height:92vh;overflow:auto;padding:22px}
.sheet h3{font-size:18px;margin-bottom:6px}
.sheet .lead{color:var(--muted);font-size:14px;margin-bottom:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--bad);font-size:13px;min-height:18px}
.keybox{background:var(--panel2);border:1px dashed var(--accent);border-radius:12px;padding:16px;text-align:center;margin:6px 0 16px}
.keybox code{font-family:inherit;font-size:24px;font-weight:700;letter-spacing:.14em;color:var(--accent);user-select:all;-webkit-user-select:all;word-break:break-all}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--accent);color:#120804;padding:10px 18px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
.toast.bad{background:var(--bad)}
.toast.show{opacity:1;transform:translateX(-50%)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="app">
  <header class="top">
    <div class="brand">Control<b>Panel</b></div>
    <div class="tools">
      <span class="count" id="count"></span>
      <button class="btn ghost sm" id="refresh" type="button">Refresh</button>
      <button class="btn ghost sm" id="bk" type="button">Backup</button>
      <button class="btn sm" id="newAcc" type="button">+ New account</button>
    </div>
  </header>

  <main class="wrap">
    <aside class="side">
      <section class="card">
        <input type="search" id="q" placeholder="Search name or number" autocomplete="off" aria-label="Search accounts">
        <div class="chips" id="chips">
          <button class="chip on" data-f="all" type="button">All</button>
          <button class="chip" data-f="starred" type="button">Starred</button>
          <button class="chip" data-f="pending" type="button">Has pending</button>
        </div>
        <select id="sort" aria-label="Sort accounts">
          <option value="new">Newest first</option>
          <option value="name">Name A to Z</option>
          <option value="earned">Highest earnings</option>
          <option value="txns">Most transactions</option>
        </select>
        <div class="tiny"><label><input type="checkbox" id="selAll"> Select all shown</label><span id="shown"></span></div>
        <div class="bulk" id="bulk">
          <span id="bulkN"></span>
          <span class="row"><button class="btn ghost sm" id="bulkStar" type="button">Star</button><button class="btn danger sm" id="bulkDel" type="button">Delete</button><button class="btn ghost sm" id="bulkClr" type="button">Clear</button></span>
        </div>
        <div class="acc-list" id="accList"></div>
        <div class="hint">Shortcuts: / search, ↑ ↓ switch account, N new account, T new transaction</div>
      </section>
    </aside>

    <section class="card" id="detail"></section>
  </main>
</div>

<div class="modal" id="aModal" role="dialog" aria-modal="true" aria-labelledby="aTitle">
  <div class="sheet">
    <h3 id="aTitle">New account</h3>
    <p class="lead" id="aLead"></p>
    <div class="stack">
      <div><label class="l" for="aUser">Username</label><input id="aUser" type="text" autocomplete="off"></div>
      <div><label class="l" for="aNum">Mobile number</label><input id="aNum" type="text" inputmode="numeric" maxlength="10" autocomplete="off"></div>
      <div id="aKeyWrap">
        <label class="l" for="aKey">Passkey</label>
        <div class="row"><input id="aKey" type="text" class="grow" autocomplete="off" spellcheck="false"><button class="btn ghost sm" id="aGen" type="button">Generate</button></div>
        <div class="hint" id="aStr" style="margin-top:5px"></div>
      </div>
      <div class="err" id="aErr"></div>
      <div class="row"><button class="btn grow" id="aSave" type="button">Save</button><button class="btn ghost" data-close type="button">Cancel</button></div>
    </div>
  </div>
</div>

<div class="modal" id="kModal" role="dialog" aria-modal="true" aria-labelledby="kTitle">
  <div class="sheet">
    <h3 id="kTitle">Passkey ready</h3>
    <p class="lead" id="kLead"></p>
    <div class="keybox"><code id="kVal"></code></div>
    <div class="row"><button class="btn grow" id="kCopy" type="button">Copy passkey</button><button class="btn ghost" data-close type="button">Done</button></div>
  </div>
</div>

<div class="modal" id="tModal" role="dialog" aria-modal="true" aria-labelledby="tTitle">
  <div class="sheet">
    <h3 id="tTitle">Add transaction</h3>
    <p class="lead"></p>
    <div class="stack">
      <div class="two">
        <div><label class="l" for="tCoins">Coins sold</label><input id="tCoins" type="number" min="0" step="any"></div>
        <div><label class="l" for="tAmt">Amount (₹)</label><input id="tAmt" type="number" min="0" step="any"></div>
      </div>
      <div>
        <label class="l" for="tId">Transaction ID</label>
        <div class="row"><input id="tId" type="text" class="grow" autocomplete="off"><button class="btn ghost sm" id="tGen" type="button">Generate</button></div>
      </div>
      <div><label class="l" for="tUpi">Paid to UPI ID</label><input id="tUpi" type="text" autocomplete="off" placeholder="name@bank"></div>
      <div class="two">
        <div><label class="l" for="tTime">Date and time</label><input id="tTime" type="datetime-local"></div>
        <div><label class="l" for="tStatus">Status</label><select id="tStatus"><option>Success</option><option>Pending</option><option>Failed</option></select></div>
      </div>
      <div class="err" id="tErr"></div>
      <div class="row"><button class="btn grow" id="tSave" type="button">Save</button><button class="btn ghost" data-close type="button">Cancel</button></div>
    </div>
  </div>
</div>

<div class="modal" id="cModal" role="dialog" aria-modal="true" aria-labelledby="cTitle">
  <div class="sheet">
    <h3 id="cTitle"></h3>
    <p class="lead" id="cText"></p>
    <div class="row"><button class="btn grow" id="cOk" type="button">Confirm</button><button class="btn ghost" id="cNo" type="button">Cancel</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL='https://fzzchglczulnybpjcuvs.supabase.co';
const SUPABASE_KEY='sb_publishable_mukwdt_HGf-QPbNTy_pW6w_TY6mhbIm';

function friendly(msg){
  const m=String(msg||'');
  if(m.includes('accounts_username_key'))return 'This username already exists.';
  if(m.includes('accounts_passkey_key'))return 'This passkey is already in use. Generate another.';
  if(m.includes('transactions_txn_id_key'))return 'This transaction ID already exists.';
  if(m.includes('weak_passkey'))return 'Passkey needs 8 or more characters with letters and numbers.';
  if(m.includes('accounts_mobile_check'))return 'Mobile number must be 10 digits.';
  if(m.includes('upi_id_check'))return 'Enter a valid UPI ID, for example name@bank.';
  if(m.includes('Failed to fetch'))return 'Could not connect. Check your internet and try again.';
  return m||'Something went wrong.';
}

async function api(method,path,body,prefer){
  const headers={'apikey':SUPABASE_KEY,'Content-Type':'application/json'};
  if(prefer)headers['Prefer']=prefer;
  let r;
  try{r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body)})}
  catch(e){throw new Error(friendly(e.message))}
  const text=await r.text();
  let d=null;
  try{d=text?JSON.parse(text):null}catch(e){}
  if(!r.ok)throw new Error(friendly((d&&(d.message||d.hint))||text));
  return d;
}

function rnd(n){const a=new Uint8Array(n);if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);else for(let i=0;i<n;i++)a[i]=Math.floor(Math.random()*256);return a}
function randKey(){const set='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return Array.from(rnd(12)).map(b=>set[b%set.length]).join('')}
function keyProblem(k){
  if(k.length<8)return 'Passkey must be at least 8 characters.';
  if(!/[a-z]/i.test(k)||!/\d/.test(k))return 'Use both letters and numbers.';
  if(/^(.)\1+$/.test(k))return 'Passkey is too repetitive.';
  return '';
}
function keyStrength(k){
  if(!k)return '';
  if(keyProblem(k))return 'Weak';
  return k.length>=12?'Strong':'Okay';
}

let accounts=[];
let loaded=false;
let selectedId=null;
const checked=new Set();
const state={q:'',filter:'all',sort:'new',limit:30,tq:'',ts:'all'};
let modalAcc=null;
let modalTx=null;

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const fmt=iso=>iso?new Date(iso).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'-';
const toLocalInput=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,16)};
const current=()=>accounts.find(a=>a.id===selectedId);
const sums=a=>{const ok=a.transactions.filter(t=>t.status==='Success');return{coins:ok.reduce((s,t)=>s+Number(t.coins||0),0),amt:ok.reduce((s,t)=>s+Number(t.amount||0),0),pending:a.transactions.filter(t=>t.status==='Pending').length}};

function toast(msg,bad){const t=$('toast');t.textContent=msg;t.classList.toggle('bad',!!bad);t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),bad?3800:1900)}
function setBusy(b,on){if(on){b.dataset.t=b.textContent;b.textContent='Please wait';b.disabled=true}else{b.textContent=b.dataset.t||b.textContent;b.disabled=false}}
async function run(fn){try{await fn();return true}catch(e){toast(e.message,true);return false}}
function openM(id){$(id).classList.add('open')}
function closeM(id){$(id).classList.remove('open')}
function openModal(){return Array.from(document.querySelectorAll('.modal.open')).pop()}
function closeTop(){const m=openModal();if(!m)return;if(m.id==='cModal')$('cNo').click();else closeM(m.id)}
document.querySelectorAll('.modal').forEach(m=>{
  m.addEventListener('mousedown',e=>{if(e.target===m)closeTop()});
  m.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>closeM(m.id)));
});

function ask(title,text,ok){
  return new Promise(res=>{
    $('cTitle').textContent=title;$('cText').textContent=text;$('cOk').textContent=ok||'Confirm';
    openM('cModal');
    const done=v=>{closeM('cModal');res(v)};
    $('cOk').onclick=()=>done(true);
    $('cNo').onclick=()=>done(false);
  });
}

function download(name,content,type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type}));
  a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

async function loadAccounts(){
  const rows=await api('GET','accounts?select=id,username,mobile,starred,created_at,transactions(id,coins,amount,txn_id,upi_id,status,txn_time)&order=created_at.desc&limit=1000');
  accounts=rows.map(r=>({
    id:r.id,username:r.username,number:r.mobile,starred:r.starred,createdAt:r.created_at,
    transactions:(r.transactions||[]).map(t=>({id:t.id,coins:Number(t.coins),amount:Number(t.amount),txnId:t.txn_id,upi:t.upi_id,status:t.status,time:t.txn_time}))
  }));
  loaded=true;
}
async function refresh(){await loadAccounts();renderAll()}

function visible(){
  const q=state.q.trim().toLowerCase();
  const l=accounts.filter(a=>{
    if(state.filter==='starred'&&!a.starred)return false;
    if(state.filter==='pending'&&!a.transactions.some(t=>t.status==='Pending'))return false;
    return !q||a.username.toLowerCase().includes(q)||a.number.includes(q);
  });
  const sorters={
    new:(x,y)=>new Date(y.createdAt)-new Date(x.createdAt),
    name:(x,y)=>x.username.localeCompare(y.username),
    earned:(x,y)=>sums(y).amt-sums(x).amt,
    txns:(x,y)=>y.transactions.length-x.transactions.length
  };
  l.sort(sorters[state.sort]);
  l.sort((x,y)=>(y.starred?1:0)-(x.starred?1:0));
  return l;
}

function renderList(){
  const all=visible();
  const show=all.slice(0,state.limit);
  $('count').textContent=loaded?accounts.length+' account'+(accounts.length===1?'':'s'):'';
  $('shown').textContent=all.length===accounts.length?'':'Showing '+all.length+' of '+accounts.length;
  $('selAll').checked=all.length>0&&all.every(a=>checked.has(a.id));
  let html=show.map(a=>`
    <div class="acc ${a.id===selectedId?'on':''}" data-id="${a.id}">
      <label class="chk"><input type="checkbox" data-chk ${checked.has(a.id)?'checked':''} aria-label="Select ${esc(a.username)}"></label>
      <button class="main" type="button"><span class="av">${esc(a.username.charAt(0).toUpperCase())}</span><span class="info"><b>${esc(a.username)}</b><small>${esc(a.number)} · ${a.transactions.length} txn</small></span><span class="val">${inr(sums(a).amt)}</span></button>
      <button class="star ${a.starred?'on':''}" data-star type="button" aria-label="Star account">★</button>
    </div>`).join('');
  if(all.length>show.length)html+=`<div class="more"><button class="btn ghost sm" id="more" type="button">Show ${Math.min(30,all.length-show.length)} more</button></div>`;
  if(!loaded)html='<div class="empty">Loading accounts</div>';
  else if(!all.length)html=`<div class="empty">${accounts.length?'No accounts match your search or filter.':'No accounts yet.'}</div>`;
  $('accList').innerHTML=html;
  renderBulk();
}

function renderBulk(){
  $('bulk').classList.toggle('on',checked.size>0);
  $('bulkN').textContent=checked.size+' selected';
}

async function setStar(ids,val){
  return run(async()=>{
    await api('PATCH','accounts?id=in.('+ids.join(',')+')',{starred:val},'return=minimal');
    await refresh();
  });
}

$('accList').addEventListener('click',async e=>{
  if(e.target.id==='more'){state.limit+=30;renderList();return}
  const row=e.target.closest('.acc');if(!row)return;
  if(e.target.closest('.chk'))return;
  const id=row.dataset.id;
  if(e.target.closest('[data-star]')){const a=accounts.find(x=>x.id===id);await setStar([id],!a.starred);return}
  selectAccount(id);
});
$('accList').addEventListener('change',e=>{
  if(!e.target.matches('[data-chk]'))return;
  const id=e.target.closest('.acc').dataset.id;
  if(e.target.checked)checked.add(id);else checked.delete(id);
  $('selAll').checked=visible().every(a=>checked.has(a.id));
  renderBulk();
});
$('selAll').onchange=e=>{
  visible().forEach(a=>{if(e.target.checked)checked.add(a.id);else checked.delete(a.id)});
  renderList();
};
$('q').oninput=e=>{state.q=e.target.value;state.limit=30;renderList()};
$('sort').onchange=e=>{state.sort=e.target.value;renderList()};
$('chips').addEventListener('click',e=>{
  const b=e.target.closest('.chip');if(!b)return;
  state.filter=b.dataset.f;state.limit=30;
  $('chips').querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));
  renderList();
});
$('bulkClr').onclick=()=>{checked.clear();renderList()};
$('bulkStar').onclick=async()=>{
  if(await setStar([...checked],true)){checked.clear();renderList();toast('Starred')}
};
$('bulkDel').onclick=async()=>{
  const n=checked.size;
  if(!await ask('Delete '+n+' account'+(n===1?'':'s')+'?','This also deletes all their transactions. This cannot be undone.','Delete'))return;
  const ids=[...checked];
  if(await run(async()=>{
    await api('DELETE','accounts?id=in.('+ids.join(',')+')',undefined,'return=minimal');
    if(ids.includes(selectedId))selectedId=null;
    checked.clear();
    await refresh();
  }))toast('Deleted');
};

function selectAccount(id){
  selectedId=id;state.tq='';state.ts='all';
  renderAll();
  const row=$('accList').querySelector('.acc.on');
  if(row)row.scrollIntoView({block:'nearest'});
}
function moveSel(dir){
  const l=visible().slice(0,state.limit);if(!l.length)return;
  let i=l.findIndex(a=>a.id===selectedId);
  i=i<0?(dir>0?0:l.length-1):Math.min(l.length-1,Math.max(0,i+dir));
  selectAccount(l[i].id);
}

function renderDetail(){
  const a=current();
  const d=$('detail');
  if(!loaded){d.innerHTML='<div class="empty big">Loading</div>';return}
  if(!a){
    d.innerHTML=accounts.length
      ?'<div class="empty big">Select an account from the list to see its transactions.</div>'
      :'<div class="empty big">Create your first account to start adding transactions.<br><button class="btn" data-act="new" type="button">+ New account</button></div>';
    return;
  }
  const s=sums(a);
  d.innerHTML=`
    <div class="head">
      <div class="who">
        <div class="av">${esc(a.username.charAt(0).toUpperCase())}</div>
        <div><h2>${esc(a.username)}</h2><div class="sub">${esc(a.number)} · created ${fmt(a.createdAt)}</div></div>
      </div>
      <div class="row w">
        <button class="btn" data-act="addTx" type="button">+ Transaction</button>
        <button class="btn ghost" data-act="star" type="button">${a.starred?'Unstar':'Star'}</button>
        <button class="btn ghost" data-act="editAcc" type="button">Edit</button>
        <button class="btn ghost" data-act="resetKey" type="button">Reset passkey</button>
        <button class="btn danger" data-act="delAcc" type="button">Delete</button>
      </div>
    </div>
    <div class="stats">
      <div><small>Coins sold</small><strong>${s.coins.toLocaleString('en-IN')}</strong></div>
      <div><small>Total received</small><strong class="ac">${inr(s.amt)}</strong></div>
      <div><small>Transactions</small><strong>${a.transactions.length}</strong></div>
      <div><small>Pending</small><strong>${s.pending}</strong></div>
    </div>
    <div class="tools2">
      <input type="search" id="tq" placeholder="Search transaction ID or UPI" value="${esc(state.tq)}" autocomplete="off" aria-label="Search transactions">
      <select id="ts" aria-label="Filter by status">
        <option value="all">All statuses</option><option>Success</option><option>Pending</option><option>Failed</option>
      </select>
      <button class="btn ghost" data-act="csv" type="button">Export CSV</button>
    </div>
    <div id="txWrap"></div>`;
  $('ts').value=state.ts;
  renderTx();
}

function renderTx(){
  const a=current();if(!a)return;
  const q=state.tq.trim().toLowerCase();
  const l=a.transactions
    .filter(t=>(state.ts==='all'||t.status===state.ts)&&(!q||t.txnId.toLowerCase().includes(q)||t.upi.toLowerCase().includes(q)))
    .sort((x,y)=>new Date(y.time)-new Date(x.time));
  $('txWrap').innerHTML=l.length?`<div class="tbl"><table>
    <thead><tr><th>Date and time</th><th>Coins</th><th>Amount</th><th>Rate</th><th>Transaction ID</th><th>UPI ID</th><th>Status</th><th></th></tr></thead>
    <tbody>${l.map(t=>`<tr>
      <td>${fmt(t.time)}</td>
      <td>${Number(t.coins).toLocaleString('en-IN')}</td>
      <td>${inr(t.amount)}</td>
      <td>${Number(t.coins)>0?inr(t.amount/t.coins):'-'}</td>
      <td class="id">${esc(t.txnId)}</td>
      <td>${esc(t.upi)}</td>
      <td><span class="tag ${t.status}">${t.status}</span></td>
      <td><div class="acts"><button class="btn ghost sm" data-e="${t.id}" type="button">Edit</button><button class="btn danger sm" data-d="${t.id}" type="button">Delete</button></div></td>
    </tr>`).join('')}</tbody></table></div>`
    :`<div class="empty">${a.transactions.length?'No transactions match your search or filter.':'No transactions yet. Use + Transaction to add the first one.'}</div>`;
}

$('detail').addEventListener('input',e=>{if(e.target.id==='tq'){state.tq=e.target.value;renderTx()}});
$('detail').addEventListener('change',e=>{if(e.target.id==='ts'){state.ts=e.target.value;renderTx()}});
$('detail').addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  const a=current();
  if(b.dataset.e){openTx(a.transactions.find(t=>t.id===b.dataset.e));return}
  if(b.dataset.d){
    if(await ask('Delete transaction?','This cannot be undone.','Delete')){
      if(await run(async()=>{await api('DELETE','transactions?id=eq.'+b.dataset.d,undefined,'return=minimal');await refresh()}))toast('Transaction deleted');
    }
    return;
  }
  switch(b.dataset.act){
    case 'new':openAccModal();break;
    case 'addTx':openTx();break;
    case 'star':await setStar([a.id],!a.starred);break;
    case 'editAcc':openAccModal(a);break;
    case 'resetKey':
      if(await ask('Reset passkey?','The current passkey stops working immediately and the user is signed out. A new one will be shown once.','Reset')){
        const key=randKey();
        if(await run(async()=>{await api('POST','rpc/admin_reset_passkey',{p_account_id:a.id,p_passkey:key})}))showKey(a.username,key,'New passkey for');
      }
      break;
    case 'delAcc':
      if(await ask('Delete "'+a.username+'"?','This also deletes all their transactions. This cannot be undone.','Delete')){
        if(await run(async()=>{await api('DELETE','accounts?id=eq.'+a.id,undefined,'return=minimal');checked.delete(a.id);selectedId=null;await refresh()}))toast('Account deleted');
      }
      break;
    case 'csv':{
      const rows=[['Username','Mobile','Date','Coins','Amount','Transaction ID','UPI ID','Status']];
      a.transactions.forEach(t=>rows.push([a.username,a.number,new Date(t.time).toISOString(),t.coins,t.amount,t.txnId,t.upi,t.status]));
      const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
      download(a.username+'-transactions.csv',csv,'text/csv');
      break;
    }
  }
});

function openAccModal(a){
  modalAcc=a?a.id:null;
  $('aTitle').textContent=a?'Edit account':'New account';
  $('aLead').textContent=a?'Update the username or mobile number.':'The passkey is shown once after you save. Only a hash is stored.';
  $('aUser').value=a?a.username:'';
  $('aNum').value=a?a.number:'';
  $('aKeyWrap').style.display=a?'none':'block';
  $('aKey').value=a?'':randKey();
  $('aStr').textContent=a?'':'Strength: '+keyStrength($('aKey').value);
  $('aErr').textContent='';
  openM('aModal');
  $('aUser').focus();
}
$('aGen').onclick=()=>{$('aKey').value=randKey();$('aStr').textContent='Strength: '+keyStrength($('aKey').value)};
$('aKey').oninput=e=>{$('aStr').textContent=e.target.value?'Strength: '+keyStrength(e.target.value):''};
$('newAcc').onclick=()=>openAccModal();

function showKey(user,key,lead){
  closeM('aModal');
  $('kLead').textContent=lead+' '+user+'. Copy it now, it cannot be viewed again.';
  $('kVal').textContent=key;
  openM('kModal');
}
$('kCopy').onclick=async()=>{
  const v=$('kVal').textContent;
  try{await navigator.clipboard.writeText(v);toast('Passkey copied')}
  catch(e){const r=document.createRange();r.selectNodeContents($('kVal'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Press copy on your device')}
};

$('aSave').onclick=async()=>{
  const btn=$('aSave'),err=$('aErr');
  const user=$('aUser').value.trim(),num=$('aNum').value.trim();
  err.textContent='';
  if(!user)return err.textContent='Enter a username.';
  if(!/^\d{10}$/.test(num))return err.textContent='Mobile number must be 10 digits.';
  if(modalAcc){
    setBusy(btn,true);
    try{
      await api('PATCH','accounts?id=eq.'+modalAcc,{username:user,mobile:num},'return=minimal');
      closeM('aModal');await refresh();toast('Account updated');
    }catch(e){err.textContent=e.message}
    finally{setBusy(btn,false)}
    return;
  }
  const key=$('aKey').value.trim();
  const p=keyProblem(key);if(p)return err.textContent=p;
  setBusy(btn,true);
  try{
    const id=await api('POST','rpc/admin_create_account',{p_username:user,p_mobile:num,p_passkey:key});
    state.q='';$('q').value='';state.filter='all';
    $('chips').querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.f==='all'));
    await loadAccounts();
    selectAccount(id);
    showKey(user,key,'Passkey for');
  }catch(e){err.textContent=e.message}
  finally{setBusy(btn,false)}
};

function openTx(t){
  if(!current())return;
  modalTx=t?t.id:null;
  $('tTitle').textContent=t?'Edit transaction':'Add transaction';
  $('tCoins').value=t?t.coins:'';
  $('tAmt').value=t?t.amount:'';
  $('tId').value=t?t.txnId:'';
  $('tUpi').value=t?t.upi:'';
  $('tTime').value=toLocalInput(t?t.time:new Date());
  $('tStatus').value=t?t.status:'Success';
  $('tErr').textContent='';
  openM('tModal');
  $('tCoins').focus();
}
$('tGen').onclick=()=>{$('tId').value='T'+Date.now().toString().slice(-9)+(Math.floor(Math.random()*90)+10)};
$('tSave').onclick=async()=>{
  const a=current();if(!a)return;
  const btn=$('tSave'),err=$('tErr');
  const coins=parseFloat($('tCoins').value),amount=parseFloat($('tAmt').value);
  const txnId=$('tId').value.trim(),upi=$('tUpi').value.trim(),time=$('tTime').value;
  err.textContent='';
  if(isNaN(coins)||coins<0)return err.textContent='Enter a valid number of coins.';
  if(isNaN(amount)||amount<0)return err.textContent='Enter a valid amount.';
  if(!txnId)return err.textContent='Enter a transaction ID.';
  if(!/^[A-Za-z0-9._-]{2,}@[A-Za-z]{2,}$/.test(upi))return err.textContent='Enter a valid UPI ID, for example name@bank.';
  if(!time)return err.textContent='Choose the date and time.';
  const row={coins,amount,txn_id:txnId,upi_id:upi,status:$('tStatus').value,txn_time:new Date(time).toISOString()};
  setBusy(btn,true);
  try{
    if(modalTx)await api('PATCH','transactions?id=eq.'+modalTx,row,'return=minimal');
    else await api('POST','transactions',{account_id:a.id,...row},'return=minimal');
    const edited=!!modalTx;
    closeM('tModal');await refresh();toast(edited?'Transaction updated':'Transaction added');
  }catch(e){err.textContent=e.message}
  finally{setBusy(btn,false)}
};

$('bk').onclick=()=>download('accounts-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(accounts,null,2),'application/json');
$('refresh').onclick=async()=>{const b=$('refresh');setBusy(b,true);if(await run(refresh))toast('Up to date');setBusy(b,false)};

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeTop();return}
  if(openModal())return;
  const tag=document.activeElement&&document.activeElement.tagName;
  const typing=tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA';
  if(e.target===$('q')&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();moveSel(e.key==='ArrowDown'?1:-1);return}
  if(e.target===$('q')&&e.key==='Enter'){const l=visible();if(l.length&&!l.some(a=>a.id===selectedId))selectAccount(l[0].id);return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('q').focus();$('q').select();return}
  if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='/'){e.preventDefault();$('q').focus()}
  else if(e.key==='ArrowDown'){e.preventDefault();moveSel(1)}
  else if(e.key==='ArrowUp'){e.preventDefault();moveSel(-1)}
  else if(e.key.toLowerCase()==='n'){e.preventDefault();openAccModal()}
  else if(e.key.toLowerCase()==='t'){e.preventDefault();openTx()}
});

function renderAll(){renderList();renderDetail()}

// Auto-load on open
(async()=>{
  renderAll();
  await run(refresh);
})();
</script>
</body>
</html>
