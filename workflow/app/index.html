<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>interface</title>
<style>
:root{--bg:#000;--panel:#0d0d0d;--panel2:#151515;--line:#262626;--text:#f4efe9;--muted:#8c857e;--accent:#D97757;--ok:#6fcf97;--warn:#e9b84f;--bad:#eb6b5e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
::selection{background:var(--accent);color:#000}
button,input{font:inherit;color:inherit}
button{cursor:pointer;outline:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{outline:none}
.view{display:none;max-width:560px;margin:0 auto;padding:24px 16px 40px}
.view.on{display:block}
.login{min-height:100vh;display:none;align-items:center;justify-content:center;padding:20px}
.login.on{display:flex}
.box{width:100%;max-width:380px;text-align:center}
.mark{width:64px;height:64px;border-radius:18px;background:var(--accent);margin:0 auto 22px;display:grid;place-items:center;color:#120804;font-size:30px;font-weight:800}
.box h1{font-size:26px;letter-spacing:-.02em}
.box p{color:var(--muted);margin:6px 0 24px}
.field{position:relative}
.field input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 64px 14px 16px;text-align:center;font-size:18px;letter-spacing:.1em;transition:border-color .15s}
.field input:focus{border-color:var(--accent)}
.field input:disabled{opacity:.5}
.field .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);font-size:13px;padding:6px 8px;border-radius:8px}
.field .eye:hover{color:var(--accent)}
.go{width:100%;margin-top:12px;background:var(--accent);color:#120804;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:16px;transition:filter .15s}
.go:hover:not(:disabled){filter:brightness(1.1)}
.go:disabled{opacity:.5;cursor:not-allowed}
.msg{font-size:14px;min-height:44px;margin-top:12px;color:var(--bad)}
.msg.info{color:var(--muted)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.bar .t{color:var(--muted);font-size:14px}
.out{background:transparent;border:1px solid var(--line);border-radius:9px;padding:6px 14px;font-size:14px;transition:.15s}
.out:hover{border-color:var(--accent);color:var(--accent)}
.me{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;gap:16px;align-items:center;margin-bottom:12px}
.av{width:56px;height:56px;border-radius:16px;background:var(--accent);color:#120804;display:grid;place-items:center;font-size:24px;font-weight:800;flex:none}
.me h2{font-size:21px;letter-spacing:-.01em;word-break:break-word}
.me .ph{color:var(--muted);font-size:15px}
.tot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.tot div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tot small{color:var(--muted);font-size:13px}
.tot strong{display:block;font-size:22px;margin-top:2px}
.tot .r strong{color:var(--accent)}
h3.h{font-size:17px;margin-bottom:12px}
.list{display:flex;flex-direction:column;gap:10px}
.tx{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:14px;padding:14px 16px}
.tx.Pending{border-left-color:var(--warn)}
.tx.Failed{border-left-color:var(--bad)}
.tx .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tx .coins{font-size:17px;font-weight:700}
.tx .amt{font-size:17px;font-weight:700;color:var(--accent)}
.tx .when{color:var(--muted);font-size:13px;margin-top:2px}
.meta{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:grid;gap:4px;font-size:13.5px}
.meta div{display:flex;justify-content:space-between;gap:12px}
.meta span:first-child{color:var(--muted)}
.meta span:last-child{text-align:right;word-break:break-all}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12.5px;border:1px solid}
.tag.Success{color:var(--ok);border-color:rgba(111,207,151,.4)}
.tag.Pending{color:var(--warn);border-color:rgba(233,184,79,.4)}
.tag.Failed{color:var(--bad);border-color:rgba(235,107,94,.4)}
.empty{color:var(--muted);text-align:center;padding:36px 10px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section class="login on" id="login">
  <form class="box" id="form" autocomplete="off">
    <div class="mark">✦</div>
    <h1>View your transactions</h1>
    <p>Enter your passkey to continue</p>
    <div class="field">
      <input id="pk" type="password" placeholder="Passkey" aria-label="Passkey" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="eye" id="eye" type="button">Show</button>
    </div>
    <button class="go" id="go" type="submit">Continue</button>
    <div class="msg" id="msg" role="alert"></div>
  </form>
</section>

<section class="view" id="home">
  <div class="bar"><span class="t">Your account</span><button class="out" id="out" type="button">Sign out</button></div>
  <div class="me">
    <div class="av" id="av"></div>
    <div><h2 id="un"></h2><div class="ph" id="ph"></div></div>
  </div>
  <div class="tot">
    <div><small>Coins sold</small><strong id="tc">0</strong></div>
    <div class="r"><small>Total received</small><strong id="ta">₹0</strong></div>
  </div>
  <h3 class="h">Transaction history</h3>
  <div class="list" id="list"></div>
</section>

<script>
const SUPABASE_URL='https://fzzchglczulnybpjcuvs.supabase.co';
const SUPABASE_KEY='sb_publishable_mukwdt_HGf-QPbNTy_pW6w_TY6mhbIm';
const SESSION='cp_session_v3';
const LOCK='cp_lock_until_v3';
const IDLE_MS=10*60*1000;
const POLL_MS=20000;

async function rpc(name,args){
  const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+name,{
    method:'POST',
    headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},
    body:JSON.stringify(args)
  });
  if(!r.ok)throw new Error('request_failed');
  const t=await r.text();
  return t?JSON.parse(t):null;
}

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const fmt=iso=>new Date(iso).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const clock=s=>{const m=Math.floor(s/60);return m>0?m+'m '+String(s%60).padStart(2,'0')+'s':s+'s'};

let token=null;
let lastActive=Date.now();
let lockUntil=0;
let tick=null;
try{token=sessionStorage.getItem(SESSION);lockUntil=Number(localStorage.getItem(LOCK))||0}catch(e){}

const lockLeft=()=>Math.max(0,Math.ceil((lockUntil-Date.now())/1000));
function setLock(secs){
  lockUntil=Date.now()+secs*1000;
  try{localStorage.setItem(LOCK,String(lockUntil))}catch(e){}
}
function setLocked(on){$('pk').disabled=on;$('go').disabled=on}
function say(text,info){const m=$('msg');m.className='msg'+(info?' info':'');m.textContent=text||''}

function refreshLock(){
  const left=lockLeft();
  if(left>0){
    setLocked(true);
    say('Too many incorrect attempts. Try again in '+clock(left)+'.');
    if(!tick)tick=setInterval(refreshLock,500);
  }else{
    if(tick){clearInterval(tick);tick=null;say('')}
    setLocked(false);
  }
}

function show(a){
  if(!a){$('login').classList.add('on');$('home').classList.remove('on');return}
  $('login').classList.remove('on');$('home').classList.add('on');
  $('av').textContent=a.username.charAt(0).toUpperCase();
  $('un').textContent=a.username;
  $('ph').textContent='+91 '+a.mobile;
  const ok=a.transactions.filter(t=>t.status==='Success');
  $('tc').textContent=ok.reduce((s,t)=>s+Number(t.coins||0),0).toLocaleString('en-IN');
  $('ta').textContent=inr(ok.reduce((s,t)=>s+Number(t.amount||0),0));
  $('list').innerHTML=a.transactions.length?a.transactions.map(t=>`
    <article class="tx ${esc(t.status)}">
      <div class="top"><span class="coins">${Number(t.coins).toLocaleString('en-IN')} coins</span><span class="amt">${inr(t.amount)}</span></div>
      <div class="when">${fmt(t.time)}</div>
      <div class="meta">
        <div><span>Status</span><span><span class="tag ${esc(t.status)}">${esc(t.status)}</span></span></div>
        <div><span>Transaction ID</span><span>${esc(t.txn_id)}</span></div>
        <div><span>Paid to UPI ID</span><span>${esc(t.upi_id)}</span></div>
      </div>
    </article>`).join(''):'<div class="empty">No transactions yet.</div>';
}

function signOut(note){
  if(token){rpc('user_logout',{p_token:token}).catch(()=>{})}
  try{sessionStorage.removeItem(SESSION)}catch(e){}
  token=null;
  show(null);
  $('pk').value='';
  say(note||'',true);
  refreshLock();
}

async function loadData(){
  if(!token)return;
  try{
    const res=await rpc('user_get_data',{p_token:token});
    if(!res||!res.ok){signOut('Your session expired. Please sign in again.');return}
    show(res);
  }catch(e){}
}

$('eye').onclick=()=>{
  const p=$('pk'),on=p.type==='password';
  p.type=on?'text':'password';
  $('eye').textContent=on?'Hide':'Show';
};

$('form').onsubmit=async e=>{
  e.preventDefault();
  if(lockLeft()>0){refreshLock();return}
  const pass=$('pk').value;
  if(!pass)return;
  setLocked(true);
  $('go').textContent='Checking';
  say('');
  let res=null;
  try{res=await rpc('user_login',{p_passkey:pass})}
  catch(err){
    $('go').textContent='Continue';
    setLocked(false);
    say('Could not connect. Check your internet and try again.');
    return;
  }
  $('go').textContent='Continue';
  $('pk').value='';
  if(res&&res.ok){
    token=res.token;
    try{sessionStorage.setItem(SESSION,token);localStorage.removeItem(LOCK)}catch(err){}
    lockUntil=0;lastActive=Date.now();
    setLocked(false);
    await loadData();
    return;
  }
  const secs=res&&res.locked_seconds?res.locked_seconds:0;
  if(secs>0){setLock(secs);refreshLock();return}
  setLocked(false);
  const left=res&&typeof res.attempts_left==='number'?res.attempts_left:null;
  say('Incorrect passkey.'+(left!==null?' '+left+' attempt'+(left===1?'':'s')+' left before a temporary lock.':''));
  $('pk').focus();
};

$('out').onclick=()=>signOut('');

['pointerdown','keydown','scroll','touchstart'].forEach(ev=>window.addEventListener(ev,()=>{lastActive=Date.now()},{passive:true}));
setInterval(()=>{if(token&&Date.now()-lastActive>IDLE_MS)signOut('You were signed out after 10 minutes of inactivity.')},15000);
setInterval(()=>{if(token&&!document.hidden)loadData()},POLL_MS);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&token)loadData()});

refreshLock();
if(token)loadData();
</script>
</body>
</html>
